name: OSINT Platform - CI Pipeline

on:
  push:
    branches:
      - main
      - master
      - "1-ticket-*"
  pull_request:
    branches:
      - main
      - master

jobs:
  infrastructure-and-iam-tests:
    name: Docker Infrastructure & IAM Smoke Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup environment file (.env)
        run: cp .env.example .env

      - name: Start Docker infrastructure
        run: docker compose up -d

      - name: Wait for services to become healthy
        run: |
          echo "Waiting for osint-mysql, osint-openldap, and osint-keycloak to report healthy..."
          timeout 180 bash -c '
            until [ "$(docker inspect -f {{.State.Health.Status}} osint-keycloak 2>/dev/null)" == "healthy" ] && \
                  [ "$(docker inspect -f {{.State.Health.Status}} osint-mysql 2>/dev/null)" == "healthy" ] && \
                  [ "$(docker inspect -f {{.State.Health.Status}} osint-openldap 2>/dev/null)" == "healthy" ]; do
              echo "Waiting for containers to be healthy... (Keycloak: $(docker inspect -f {{.State.Health.Status}} osint-keycloak 2>/dev/null || echo starting))"
              sleep 5
            done
          '
          echo "All services are healthy!"
          docker compose ps

      - name: Run IAM & Infrastructure integration tests
        run: |
          chmod +x ./tests/test-iam.sh
          ./tests/test-iam.sh

      - name: Dump container logs on failure
        if: failure()
        run: docker compose logs

      - name: Stop and teardown infrastructure
        if: always()
        run: docker compose down -v
